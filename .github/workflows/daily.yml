name: Daily free conferences → WhatsApp

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch, filter and send
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python main.py
      - name: Save seen list
        if: always()
        run: |
          git config user.name "conf-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || git commit -m "update seen list"
          git push || true
